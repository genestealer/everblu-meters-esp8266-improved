name: ESP8266 Build

on:
  push:
    branches: [main, master, develop]
    paths:
      - src/**
      - include/**
      - platformio.ini
      - .github/workflows/build-esp8266.yml
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - src/**
      - include/**
      - platformio.ini
      - .github/workflows/build-esp8266.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - name: huzzah
            board: Adafruit HUZZAH ESP8266
            suffix: ""
          # private.h defaults WIFI_SERIAL_MONITOR_ENABLED to 0, so without this
          # variant the mirror, its ring buffer and the `Serial` remap are
          # #ifdef'd out of every job and never compiled.
          - name: huzzah
            board: Adafruit HUZZAH ESP8266 (WiFi serial monitor)
            suffix: "-wifi-serial"
            wifi_serial: true
          - name: d1_mini_pro
            board: WeMos D1 Mini Pro
            suffix: ""
          - name: d1_mini
            board: WeMos D1 Mini
            suffix: ""
          - name: nodemcuv2
            board: NodeMCU v2
            suffix: ""

    name: Build ${{ matrix.environment.board }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-esp8266-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp8266-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Create private.h from example if missing
        run: |
          if [ ! -f include/private.h ]; then
            cp include/private.example.h include/private.h
            echo "Created private.h from private.example.h"
          fi

      - name: Inject dummy values for CI build
        run: |
          sed -i 's/#define METER_CODE "xx-xxxxxxx-xxx"/#define METER_CODE "99-1234567-000"/g' include/private.h
          echo "Injected dummy METER_CODE=99-1234567-000 for CI build"

      - name: Register GCC problem matcher
        run: echo "::add-matcher::.github/workflows/matchers/gcc.json"

      - name: Build PlatformIO Project (${{ matrix.environment.board }})
        # The WiFi serial monitor variant is selected with a compiler define rather
        # than by rewriting private.h. A sed that no longer matches exits 0 having
        # changed nothing, which would quietly build a duplicate of the default job
        # and still report success. private.example.h wraps the define in #ifndef
        # precisely so this override is possible. None of the ESP8266 environments
        # set build_flags in platformio.ini, so replacing them here loses nothing.
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.environment.wifi_serial && '-DWIFI_SERIAL_MONITOR_ENABLED=1' || '' }}
        run: |
          echo "Building with warning analysis..."
          echo "Extra build flags: '${PLATFORMIO_BUILD_FLAGS}'"
          pio run -e ${{ matrix.environment.name }} -v 2>&1 | tee build-output.log

          # Check build status
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed"
            exit 1
          fi

          echo "✅ Build successful"

      - name: Analyze compiler warnings
        if: always()
        run: |
          echo "🔍 Analyzing compiler warnings..."

          # Extract warnings from build output
          grep -i "warning:" build-output.log > warnings.txt || true

          WARNING_COUNT=$(wc -l < warnings.txt || echo 0)

          echo "Found $WARNING_COUNT compiler warning(s)"

          if [ $WARNING_COUNT -gt 0 ]; then
            echo "" >> warnings-summary.md
            echo "## ⚠️ Compiler Warnings Found: $WARNING_COUNT" >> warnings-summary.md
            echo "" >> warnings-summary.md

            # Categorize warnings
            UNUSED_VAR=$(grep -c "unused variable" warnings.txt || echo 0)
            DEPRECATED=$(grep -c "deprecated" warnings.txt || echo 0)
            COMPARISON=$(grep -c "comparison" warnings.txt || echo 0)
            SIGN_COMPARE=$(grep -c "sign-compare" warnings.txt || echo 0)
            TYPE_LIMITS=$(grep -c "type-limits" warnings.txt || echo 0)

            echo "### Warning Categories" >> warnings-summary.md
            echo "- Unused variables: $UNUSED_VAR" >> warnings-summary.md
            echo "- Deprecated: $DEPRECATED" >> warnings-summary.md
            echo "- Comparisons: $COMPARISON" >> warnings-summary.md
            echo "- Sign comparison: $SIGN_COMPARE" >> warnings-summary.md
            echo "- Type limits: $TYPE_LIMITS" >> warnings-summary.md
            echo "" >> warnings-summary.md

            # Show first 20 warnings
            echo "### First 20 Warnings" >> warnings-summary.md
            echo '```' >> warnings-summary.md
            head -20 warnings.txt >> warnings-summary.md
            echo '```' >> warnings-summary.md

            cat warnings-summary.md >> $GITHUB_STEP_SUMMARY

            # Warning threshold (fail if too many)
            if [ $WARNING_COUNT -gt 50 ]; then
              echo "❌ Too many warnings ($WARNING_COUNT > 50 threshold)"
              echo "Please address compiler warnings before merging"
              exit 1
            fi
          else
            echo "✅ No compiler warnings found!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp8266-${{ matrix.environment.name }}${{ matrix.environment.suffix }}
          path: .pio/build/${{ matrix.environment.name }}/firmware.*
          retention-days: 30

      - name: Upload build logs and warnings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-esp8266-${{ matrix.environment.name }}${{ matrix.environment.suffix }}
          path: |
            build-output.log
            warnings.txt
            warnings-summary.md
          retention-days: 30
