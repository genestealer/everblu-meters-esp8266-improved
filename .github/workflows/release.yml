name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        env:
          # Never interpolate ${{ github.event.inputs.* }} directly into the shell
          # script: a crafted tag would be executed. Pass it through the environment
          # and reference the quoted variable instead.
          TAG_INPUT: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Reject anything that is not a plain version tag, so no downstream step
          # can be fed shell metacharacters through the dispatch input.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to release '$TAG': expected a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "# EverBlu Meters ESP8266/ESP32 - Version ${VERSION}" > release-notes.md
          echo "" >> release-notes.md
          echo "## What's Changed" >> release-notes.md
          echo "" >> release-notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "Changes since ${PREV_TAG}:" >> release-notes.md
            echo "" >> release-notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges >> release-notes.md
          else
            echo "Initial release" >> release-notes.md
          fi

          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Supported Boards" >> release-notes.md
          echo "" >> release-notes.md
          echo "- **ESP8266**: Adafruit HUZZAH, WeMos D1 Mini Pro, NodeMCU v2" >> release-notes.md
          echo "- **ESP32**: ESP32 Dev Module" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Installation" >> release-notes.md
          echo "" >> release-notes.md
          echo "No prebuilt binaries are published, because the firmware has to be built with your own meter details." >> release-notes.md
          echo "" >> release-notes.md
          echo "1. Check out the repository at this tag" >> release-notes.md
          echo "2. Copy \`include/private.example.h\` to \`include/private.h\` and fill in your Wi-Fi, MQTT and meter settings" >> release-notes.md
          echo "3. Build and flash with PlatformIO, for example \`pio run -e huzzah -t upload\`" >> release-notes.md
          echo "" >> release-notes.md
          echo "For ESPHome, point your YAML at the external component in \`ESPHOME-release/\`." >> release-notes.md
          echo "" >> release-notes.md
          echo "## Documentation" >> release-notes.md
          echo "" >> release-notes.md
          echo "See [README.md](https://github.com/${REPO}/blob/main/README.md) for full documentation." >> release-notes.md

          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "### Release ${TAG} created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "View the release at: https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
