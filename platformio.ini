; ============================================================================
; PlatformIO Project Configuration File
; ============================================================================
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Documentation: https://docs.platformio.org/page/projectconf.html
;
; Board References:
;   ESP8266: https://docs.platformio.org/en/stable/boards/index.html#espressif-8266
;   ESP32:   https://docs.platformio.org/en/stable/boards/index.html#espressif-32
;
; Usage:
;   - Select environment via default_envs below or PlatformIO status bar
;   - Use *-ota environments for Over-The-Air updates (set device IP first)
;   - Use regular environments for USB/Serial uploads
;
; ============================================================================

[platformio]
default_envs = huzzah

; ============================================================================
; Base Configuration (shared by all environments)
; ============================================================================
[env:base]
framework = arduino
lib_deps =
    plapointe6/EspMQTTClient
    ArduinoOTA
monitor_speed = 115200
upload_speed = 460800
; Use the "direct" monitor filter so raw bytes (including ANSI colour escape
; sequences emitted by the firmware logger) are passed through unchanged to the
; terminal. The default filter rewrites control characters into printable
; Unicode glyphs (e.g. ESC -> the "␛" symbol), which prevents colour rendering.
monitor_filters = direct
; Unit tests are pure logic and run on the host via `pio test -e native`.
; Nothing in test/ needs real hardware, so exclude every suite here.
test_ignore = test_native_meter_fixtures, test_embedded_unit, test_native_meter_reader, test_native_esphome_publisher

; ============================================================================
; ESP8266 Environments
; ============================================================================

; ----------------------------------------------------------------------------
; Adafruit HUZZAH ESP8266
; https://docs.platformio.org/en/stable/boards/espressif8266/huzzah.html
; ----------------------------------------------------------------------------
[env:huzzah]
extends = env:base
platform = espressif8266
board = huzzah

[env:huzzah-ota]
extends = env:huzzah
upload_protocol = espota
upload_port = 192.168.2.21  ; Set your device IP here
monitor_port = socket://192.168.2.21:23
extra_scripts = post:scripts/monitor_delay.py
custom_monitor_connect_delay = 30

; ----------------------------------------------------------------------------
; WeMos D1 Mini Pro
; https://docs.platformio.org/en/stable/boards/espressif8266/d1_mini_pro.html
; ----------------------------------------------------------------------------
[env:d1_mini_pro]
extends = env:base
platform = espressif8266
board = d1_mini_pro

[env:d1_mini_pro-ota]
extends = env:d1_mini_pro
upload_protocol = espota
upload_port = 192.168.2.22  ; Set your device IP here
monitor_port = socket://192.168.2.22:23
extra_scripts = post:scripts/monitor_delay.py
custom_monitor_connect_delay = 30

; ----------------------------------------------------------------------------
; WeMos D1 Mini (non-Pro)
; https://docs.platformio.org/en/stable/boards/espressif8266/d1_mini.html
; ----------------------------------------------------------------------------
[env:d1_mini]
extends = env:base
platform = espressif8266
board = d1_mini

[env:d1_mini-ota]
extends = env:d1_mini
upload_protocol = espota
upload_port = 192.168.2.23  ; Set your device IP here
monitor_port = socket://192.168.2.23:23
extra_scripts = post:scripts/monitor_delay.py
custom_monitor_connect_delay = 30

; ----------------------------------------------------------------------------
; NodeMCU v2 (ESP-12E)
; https://docs.platformio.org/en/stable/boards/espressif8266/nodemcuv2.html
; ----------------------------------------------------------------------------
[env:nodemcuv2]
extends = env:base
platform = espressif8266
board = nodemcuv2

[env:nodemcuv2-ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = 192.168.2.23  ; Set your device IP here
monitor_port = socket://192.168.2.23:23
extra_scripts = post:scripts/monitor_delay.py
custom_monitor_connect_delay = 30

; ============================================================================
; ESP32 Environments
; ============================================================================
;
; The ESP32 platform is pinned to 6.12.0 (arduino-esp32 2.0.x). Newer releases
; of the espressif32 platform ship arduino-esp32 3.x, which drops the implicit
; WiFi.h include that EspMQTTClient relies on, so the MQTT build fails with
; "'WiFi' was not declared in this scope". Remove the pin only once the MQTT
; client dependency supports arduino-esp32 3.x.

; ----------------------------------------------------------------------------
; ESP32 DevKit
; https://docs.platformio.org/en/stable/boards/espressif32/esp32dev.html
; ----------------------------------------------------------------------------
[env:esp32dev]
extends = env:base
platform = espressif32@6.12.0
board = esp32dev

; ----------------------------------------------------------------------------
; ESP32-C3 DevKitM-1
; https://docs.platformio.org/en/stable/boards/espressif32/esp32-c3-devkitm-1.html
; ----------------------------------------------------------------------------
[env:esp32-c3-ard]
extends = env:base
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.2.50  ; Set your device IP here
monitor_port = socket://192.168.2.50:23
extra_scripts = post:scripts/monitor_delay.py
custom_monitor_connect_delay = 30

; ============================================================================
; Native Test Environment (host/CI, no hardware)
; ============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter =
    test_native_meter_fixtures
    test_embedded_unit
    test_native_meter_reader
build_src_filter =
    +<core/crc_kermit.cpp>
    +<core/radian_parser.cpp>
    +<core/radian_decoder.cpp>
    +<core/utils.cpp>
    +<services/frequency_manager.cpp>
    +<services/meter_history.cpp>
    +<services/meter_reader.cpp>
    +<services/schedule_manager.cpp>
build_flags =
    -Isrc
    ; test/native_shims provides a minimal Arduino.h so platform-neutral
    ; service code can be compiled and tested on the host.
    -Itest/native_shims
    ; test/native_fakes.{h,cpp} supplies the CC1101, storage and WiFi-serial
    ; link seams that every host suite needs.
    -Itest
    -std=gnu++17
    --coverage
    -lgcov
build_unflags =
    -O2

; ============================================================================
; Native ESPHome Test Environment (host/CI, no hardware)
; ============================================================================
; Compiles the shared sources the way the ESPHome external component does -
; USE_ESPHOME defined and the source folders flattened onto the include path -
; against the recording sensor stubs in test/native_esphome/. That covers
; ESPHomeDataPublisher, which is entirely #ifdef'd out of the MQTT build and so
; is invisible to [env:native].
; ============================================================================
[env:native_esphome]
platform = native
test_framework = unity
test_build_src = yes
test_filter =
    test_native_esphome_publisher
build_src_filter =
    +<core/crc_kermit.cpp>
    +<core/radian_parser.cpp>
    +<core/radian_decoder.cpp>
    +<core/utils.cpp>
    +<adapters/implementations/esphome_data_publisher.cpp>
    +<services/frequency_manager.cpp>
    +<services/meter_history.cpp>
    +<services/meter_reader.cpp>
    +<services/schedule_manager.cpp>
build_flags =
    -DUSE_ESPHOME
    ; The ESPHome component ships a flattened source tree, so the unqualified
    ; includes guarded by USE_ESPHOME resolve from these folders.
    -Isrc
    -Isrc/core
    -Isrc/services
    -Isrc/adapters
    -Isrc/adapters/implementations
    -Itest
    -Itest/native_shims
    -Itest/native_esphome
    -std=gnu++17
    --coverage
    -lgcov
build_unflags =
    -O2
; Interactive host program for decoding RADIAN hex frame dumps from the serial
; log.  Run with:  pio run -e hex_decoder && .pio/build/hex_decoder/program
;
; The tool lives in tools/ (outside src/) so it is invisible to both the
; firmware builds and the prepare-component-release scripts -- no changes to
; either are needed.
;
; build_src_filter selects only the three pure-C++ core files from src/.
; tools/hex_decoder.cpp is injected via an extra SCons script because
; build_src_filter can only reference files relative to src_dir (= src/).
; ============================================================================
[env:hex_decoder]
platform = native
extra_scripts = pre:tools/hex_decoder_extra.py
build_src_filter =
    +<core/crc_kermit.cpp>
    +<core/radian_parser.cpp>
    +<core/radian_decoder.cpp>
build_flags =
    -Isrc
    -std=gnu++17
