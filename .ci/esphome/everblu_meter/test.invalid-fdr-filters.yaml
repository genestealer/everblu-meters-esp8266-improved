# Deliberately invalid dedicated FDR output contract.
esphome:
  name: ci-invalid-fdr-filters
  min_version: 2026.1.0

esp8266:
  board: d1_mini
  framework:
    version: recommended

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: CI-WIFI
  password: CI-PASSWORD

spi:
  id: ci_spi
  clk_pin: GPIO14
  miso_pin: GPIO12
  mosi_pin: GPIO13

time:
  - platform: sntp
    id: ci_time

external_components:
  - source:
      type: local
      path: ../../../ESPHOME-release
    components: [ everblu_meter ]

everblu_meter:
  spi_id: ci_spi
  cs_pin: GPIO15
  meter_code: "21-0123456"
  gdo0_pin: GPIO4
  gdo2_pin: GPIO5
  time_id: ci_time
  volume:
    name: "CI Volume"
  fdr_history_json:
    id: filtered_archive
    filters:
      - prepend: broken
