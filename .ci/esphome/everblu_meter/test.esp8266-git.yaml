# Git external_components smoke test.
# Validates the component is consumable via the public GitHub URL (end-user path).
#
# Defaults to upstream main. CI overrides both git_url and git_ref with the
# current repository and branch, so pushes to forks test the fork's release.
# -s/--substitution is a GLOBAL ESPHome option and must precede the subcommand:
#   esphome -s git_ref "$GITHUB_REF_NAME" \
#     -s git_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" config <file>
# Placed after the subcommand the overrides are silently ignored.
#
# NOTE: this fetches over GitHub, so it tests the LAST PUSHED commit of the
# branch (ESPHOME-release must be regenerated + committed). It is skipped on
# pull requests; the local twin (test.esp8266-git-local.yaml) covers PRs.

esphome:
  name: ci-esp8266-git
  min_version: 2026.1.0

esp8266:
  board: d1_mini
  framework:
    version: recommended

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: CI-WIFI
  password: CI-PASSWORD

substitutions:
  git_ref: main
  git_url: https://github.com/genestealer/everblu-meters-esp8266-improved

external_components:
  - source:
      type: git
      url: ${git_url}
      ref: ${git_ref}
      path: ESPHOME-release
    components: [ everblu_meter ]
    refresh: 0s

<<: !include common-git-source.yaml
